
<script>
"use strict";

// Safe helper for displaying results
function showResult(id, message) {
  const el = document.getElementById(id);
  if (!el) {
    alert("Website error: missing result area " + id);
    return;
  }
  el.textContent = message;
  el.style.display = "block";
}

function getValue(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function getNumber(id) {
  return Number(getValue(id));
}

// MOBILE MENU
function toggleMenu() {
  const nav = document.getElementById("navigation");
  if (nav) nav.classList.toggle("open");
}

// LANGUAGE
function changeLanguage() {
  const language = getValue("language") || "en";
  document.documentElement.lang = language;

  document.querySelectorAll("[data-en]").forEach(function(el) {
    el.textContent = el.getAttribute("data-" + language);
  });
}

// WEATHER
async function getWeather() {
  const place = getValue("place");
  if (!place) {
    alert("Enter your village or city.");
    return;
  }

  const loading = document.getElementById("weatherLoading");
  loading.textContent = "Searching for location...";

  try {
    const geoURL =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(place) + "&count=1&language=en&format=json";

    const geoResponse = await fetch(geoURL);
    if (!geoResponse.ok) throw new Error("Location service unavailable");

    const geo = await geoResponse.json();
    if (!geo.results || !geo.results.length) {
      throw new Error("Location not found. Try another name.");
    }

    const loc = geo.results[0];
    await loadForecast(
      loc.latitude,
      loc.longitude,
      loc.name + ", " + (loc.admin1 || loc.country)
    );

  } catch (error) {
    loading.textContent = error.message;
  }
}

async function loadForecast(lat, lon, place) {
  const loading = document.getElementById("weatherLoading");
  loading.textContent = "Loading forecast...";

  try {
    const url =
      "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lon +
      "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max" +
      "&forecast_days=7&timezone=auto";

    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather service unavailable");

    const data = await response.json();
    if (!data.current || !data.daily) throw new Error("Invalid weather data");

    document.getElementById("dashTemp").textContent =
      data.current.temperature_2m + "°C";

    document.getElementById("dashPlace").textContent = place;

    document.getElementById("dashWeatherStatus").textContent =
      weatherDescription(data.current.weather_code);

    showResult(
      "weatherResult",
      "Location: " + place +
      "\nTemperature: " + data.current.temperature_2m + "°C" +
      "\nHumidity: " + data.current.relative_humidity_2m + "%" +
      "\nWind: " + data.current.wind_speed_10m + " km/h" +
      "\nCondition: " + weatherDescription(data.current.weather_code)
    );

    const box = document.getElementById("weatherDays");
    box.innerHTML = "";

    data.daily.time.forEach(function(date, i) {
      const day = document.createElement("div");
      day.className = "day";

      const dateText = new Date(date + "T12:00:00")
        .toLocaleDateString("en-IN", {
          weekday: "short",
          day: "numeric",
          month: "short"
        });

      day.textContent =
        dateText + "\n" +
        "Max: " + data.daily.temperature_2m_max[i] + "°C\n" +
        "Min: " + data.daily.temperature_2m_min[i] + "°C\n" +
        "Rain: " + data.daily.precipitation_sum[i] + " mm\n" +
        "Rain chance: " +
        (data.daily.precipitation_probability_max[i] ?? "--") + "%";

      box.appendChild(day);
    });

    const rain = data.daily.precipitation_sum.reduce(
      function(total, value) { return total + value; }, 0
    );

    let alertMessage = "Seven-day rainfall: " + rain.toFixed(1) + " mm. ";

    if (rain < 10) {
      alertMessage += "Low rainfall forecast. Monitor irrigation.";
    } else if (rain > 100) {
      alertMessage += "High rainfall forecast. Check field drainage.";
    } else {
      alertMessage += "Monitor your field and rainfall regularly.";
    }

    showResult("weatherAlerts", alertMessage);
    loading.textContent = "Weather loaded successfully.";

  } catch (error) {
    loading.textContent = error.message;
  }
}

function weatherDescription(code) {
  if (code === 0) return "Clear sky";
  if ([1, 2, 3].includes(code)) return "Cloudy";
  if ([45, 48].includes(code)) return "Fog";
  if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "Rain";
  if ([95, 96, 99].includes(code)) return "Thunderstorm";
  return "Variable weather";
}

// GPS LOCATION
function useGPS() {
  if (!navigator.geolocation) {
    alert("Location is not supported.");
    return;
  }

  document.getElementById("weatherLoading").textContent =
    "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      loadForecast(
        position.coords.latitude,
        position.coords.longitude,
        "Your current location"
      );
    },
    function() {
      document.getElementById("weatherLoading").textContent =
        "Location permission denied. Enter your city instead.";
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

// WATER RISK
function checkWater() {
  const moistureText = getValue("soilMoisture");
  const rainText = getValue("expectedRain");
  const waterText = getValue("availableWater");
  const areaText = getValue("waterArea");

  if ([moistureText, rainText, waterText, areaText].some(v => v === "")) {
    alert("Complete all water fields.");
    return;
  }

  const moisture = Number(moistureText);
  const rain = Number(rainText);
  const water = Number(waterText);
  const area = Number(areaText);

  if (!Number.isFinite(moisture) || moisture < 0 || moisture > 100 ||
      !Number.isFinite(rain) || rain < 0 ||
      !Number.isFinite(water) || water < 0 ||
      !Number.isFinite(area) || area <= 0) {
    alert("Enter valid values. Soil moisture must be 0–100%.");
    return;
  }

  let risk = 0;

  if (moisture < 20) risk += 45;
  else if (moisture < 40) risk += 25;
  else if (moisture < 60) risk += 10;

  if (rain < 5) risk += 25;
  else if (rain < 20) risk += 10;

  if (water === 0) risk += 25;
  else if (water < 1000 * area) risk += 15;

  risk = Math.min(risk, 95);

  const level = risk >= 65 ? "High" :
                risk >= 35 ? "Moderate" : "Low";

  document.getElementById("dashWater").textContent = level;

  showResult(
    "waterResult",
    "Estimated water risk: " + level +
    "\nRisk score: " + risk + "/100" +
    "\nSoil moisture: " + moisture + "%" +
    "\nRainfall expected: " + rain + " mm" +
    "\nWater available: " + water + " litres" +
    "\nFarm area: " + area + " acres" +
    "\n\nMonitor soil moisture and field conditions. This is a screening estimate, not a measured drought forecast."
  );
}

// CROP PREDICTION
function predictCrop() {
  const crop = getValue("crop");
  const area = getNumber("area");
  const previousText = getValue("previousYield");

  if (!crop || !area || area <= 0 || previousText === "") {
    alert("Enter crop, farm area and previous yield.");
    return;
  }

  const previous = Number(previousText);

  if (!Number.isFinite(previous) || previous < 0) {
    alert("Enter a valid previous yield.");
    return;
  }

  const benchmark = {
    "Soybean": 7,
    "Cotton": 8,
    "Wheat": 12,
    "Maize": 15,
    "Rice": 15,
    "Pigeon pea": 5,
    "Chickpea": 7,
    "Groundnut": 8,
    "Onion": 100
  };

  let factor = 1;

  const condition = getValue("cropCondition");
  const water = getValue("cropWater");
  const fertilizer = getValue("fertilizer");
  const rainfall = getValue("rainCondition");

  if (condition === "good") factor *= 1.1;
  if (condition === "poor") factor *= 0.75;

  if (water === "medium") factor *= 0.85;
  if (water === "poor") factor *= 0.65;

  if (fertilizer === "good") factor *= 1.05;
  if (fertilizer === "poor") factor *= 0.85;

  if (rainfall === "low") factor *= 0.8;
  if (rainfall === "high") factor *= 0.85;

  const base = previous > 0
    ? previous * 0.6 + benchmark[crop] * 0.4
    : benchmark[crop];

  const perAcre = base * factor;
  const total = perAcre * area;

  showResult(
    "predictionResult",
    "Crop: " + crop +
    "\nArea: " + area + " acres" +
    "\nEstimated yield per acre: " + perAcre.toFixed(2) + " quintals" +
    "\nEstimated total yield: " + total.toFixed(2) + " quintals" +
    "\nIllustrative range: " + (total * 0.8).toFixed(2) +
    " to " + (total * 1.2).toFixed(2) + " quintals" +
    "\n\nThis is a simplified planning estimate, not a validated crop prediction."
  );

  document.getElementById("dashYield").textContent =
    total.toFixed(1) + " q";
}

// HARVEST PLANNER
function calculateHarvest() {
  const date = getValue("sowingDate");
  const days = Number(getValue("harvestCrop"));

  if (!date) {
    alert("Select your sowing date.");
    return;
  }

  if (!Number.isFinite(days) || days <= 0) {
    alert("Select a valid crop duration.");
    return;
  }

  const result = new Date(date + "T12:00:00");
  result.setDate(result.getDate() + days);

  const formatted = result.toLocaleDateString("en-IN", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });

  showResult(
    "harvestResult",
    "Estimated harvest date: " + formatted +
    "\nEstimated growing duration: " + days + " days." +
    "\nConfirm actual crop maturity before harvesting."
  );

  document.getElementById("dashHarvest").textContent =
    result.toLocaleDateString("en-IN", {
      day: "numeric",
      month: "short"
    });
}

// CROP HEALTH
function checkHealth() {
  const crop = getValue("healthCrop");
  const symptom = getValue("symptom");

  if (!crop) {
    alert("Enter the crop name.");
    return;
  }

  const advice = {
    yellow: "Yellow leaves may be associated with nutrient deficiency, excess water, drought or disease. Check drainage and consider soil testing.",
    spots: "Leaf spots can have different causes. Inspect both leaf surfaces and seek local expert diagnosis.",
    wilting: "Check soil moisture, drainage and roots. Both drought and root damage can cause wilting.",
    holes: "Inspect leaves for insects or larvae. Identify the pest before choosing a treatment.",
    white: "White powder may be associated with powdery mildew or other problems. Seek crop-specific advice.",
    stunted: "Check water, nutrients, root health and pest damage.",
    root: "Check for root rot, waterlogging, compaction or insect damage."
  };

  showResult(
    "healthResult",
    "Crop: " + crop + "\nGuidance: " + advice[symptom] +
    "\n\nConsult an agricultural expert for diagnosis and treatment."
  );
}

// SOIL GUIDANCE
function soilAdvice() {
  const soil = getValue("soilGuide");

  const advice = {
    black: "Black soil often retains moisture. Monitor drainage and avoid working it when excessively wet.",
    red: "Red soil may benefit from appropriate organic matter management and soil testing.",
    alluvial: "Alluvial soil can support many crops. Test nutrients and maintain balanced fertilizer management.",
    sandy: "Sandy soil drains quickly. Manage irrigation carefully and improve organic matter.",
    clay: "Clay soil can retain water. Monitor drainage and avoid compaction.",
    loamy: "Loamy soil often offers balanced drainage and moisture retention. Maintain organic matter."
  };

  showResult(
    "soilResult",
    advice[soil] +
    "\n\nGet a soil test before deciding fertilizer requirements."
  );
}

// SET DEFAULT SOWING DATE
document.addEventListener("DOMContentLoaded", function() {
  const dateInput = document.getElementById("sowingDate");

  if (dateInput && !dateInput.value) {
    dateInput.value = new Date().toISOString().slice(0, 10);
  }
});

</script>
